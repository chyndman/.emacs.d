[window]
option_as_alt = "Both"
padding.x = 8
padding.y = 8
dimensions.columns = 120
dimensions.lines = 30

[env]
COLORTERM = "truecolor"

[font]
normal.family = "Source Code Pro"
size = 13

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

# https://stephango.com/flexoki

[colors.primary]
background = "#FFFCF0"
foreground = "#100F0F"

[colors.normal]
black = "#100F0F"
red = "#AF3029"
green = "#66800B"
yellow = "#AD8301"
blue = "#205EA6"
magenta = "#A02F6F"
cyan = "#24837B"
white = "#CECDC3"

[colors.bright]
black = "#403E3C"
red = "#D14D41"
yellow = "#D0A215"
green = "#879A39"
blue = "#4385BE"
magenta = "#CE5D97"
cyan = "#3AA99F"
white = "#F2F0E5"
